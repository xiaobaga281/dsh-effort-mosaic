name: Attach release tarball

on:
  push:
    paths:
      - .github/workflows/attach-release-asset.yml

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download npm package
        run: |
          curl -fsSL -o dsh-effort-mosaic.tgz https://registry.npmjs.org/dsh-effort-mosaic/-/dsh-effort-mosaic-1.1.9.tgz
          ls -l dsh-effort-mosaic.tgz
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dsh-effort-mosaic.tgz \
            "https://uploads.github.com/repos/xiaobaga281/dsh-effort-mosaic/releases/449924572/assets?name=dsh-effort-mosaic.tgz"
